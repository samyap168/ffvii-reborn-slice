<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Audio Test Harness</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; margin: 16px; }
    button { margin: 2px; padding: 4px 8px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3a3a3a; }
    h2 { font-size: 15px; margin: 14px 0 6px; color: #9cf; }
    #status { color: #8f8; }
  </style>
</head>
<body>
  <h1>FFVII Reborn — procedural audio harness</h1>
  <p id="status">Click "Init audio" to start (live preview). Offline rendering is driven by tools/audio/render.mjs.</p>
  <button id="init">Init audio</button>
  <label>intensity <input id="inten" type="range" min="0" max="1" step="0.01" value="0" /></label>
  <label>weather <input id="weather" type="range" min="0" max="1" step="0.01" value="0" /></label>
  <label>timescale <input id="ts" type="range" min="0.1" max="1" step="0.01" value="1" /></label>
  <div id="ui"></div>
  <script type="module" src="./harness.ts"></script>
</body>
</html>
